version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cropshield_db
    restart: always
    environment:
      POSTGRES_USER: cropshield_user
      POSTGRES_PASSWORD: cropshield_password
      POSTGRES_DB: cropshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
